[project]
name = "bottled-elevate-tests"
version = "0.1.0"
description = "OpenHost integration test for the Elevate app (the app itself is Go + SolidJS)"
requires-python = "==3.12.*"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.0",
    "playwright==1.62.0",
    "openhost[test-harness] @ git+https://github.com/imbue-openhost/openhost@main",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
addopts = "-v"
testpaths = ["tests"]

[tool.ruff]
line-length = 119
