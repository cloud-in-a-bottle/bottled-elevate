[app]
name = "elevate"
version = "0.2.0"
description = "Elevate fitness analytics, fed by the Cloud in a Bottle health-data service"

[runtime.container]
image = "Dockerfile"
port = 8080

[routing]
health_check = "/health"

[resources]
memory_mb = 256
cpu_millicores = 200
# The image build (npm ci + Vite bundle + Go compile) needs more than the runtime footprint.
build_memory_mb = 2048

[data]
# Durable store: athlete + user settings, computed activities and their raw streams.
sqlite = ["main"]

[[services.v2.consumes]]
service = "github.com/imbue-openhost/health-data-service-spec"
shortname = "health"
version = ">=0.1.0"
